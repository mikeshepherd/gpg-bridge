[package]
name = "gpg-bridge"
version = "0.1.0"
edition = "2024"
default-run = "gpg-bridge"
description = "A utility to bridge gpg agent from windows over ssh"
license = "MIT"
repository = "https://github.com/mikeshepherd/gpg-bridge"
readme = "README.md"
keywords = ["cli"]
categories = ["cli"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
log = "0.4.29"
pretty_env_logger = "0.5.0"
tokio = { version = "1.48.0", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }
rustls-pemfile = "2"
fastrand = "2"
thiserror = "2"
socket2 = "0.6"
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[[bin]]
name = "gpg-bridge"
path = "src/main.rs"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
pedantic = "deny"
cargo = "deny"
multiple_crate_versions = { level = "allow", priority = 1 }
