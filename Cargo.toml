[package]
name = "gpg-bridge"
version = "0.1.0"
edition = "2024"
default-run = "gpg-bridge"
description = "A utility to bridge gpg agent from windows over ssh"
license = "MIT"
repository = "https://github.com/mikeshepherd/gpg-bridge"
readme = "README.md"
keywords = ["cli"]
categories = ["cli"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
lazy-regex = "3.4.2"
regex = "1.12.2"
signal-hook = "0.3.18"
tokio = { version = "1.48.0", features = [
  "fs",
  "full",
  "net",
  "process",
  "signal",
  "sync",
] }

[[bin]]
name = "gpg-bridge"
path = "src/main.rs"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
pedantic = "deny"
cargo = "deny"
multiple_crate_versions = { level = "allow", priority = 1 }
